<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; }
    .faint { color: #bbbbbb; background: #ffffff; }
    .no-ring:focus { outline: none; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <p class="faint">Low contrast fine print that is hard to read.</p>
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="40" height="40">
  <input type="text" id="coupon">
  <button class="no-ring" type="button">Apply</button>
  <input type="text" id="trap" aria-label="Card number">
  <a href="/after-trap">Unreachable link</a>
  <script>
    document.getElementById("trap").addEventListener("keydown", function (e) {
      if (e.key === "Tab") e.preventDefault();
    });
  </script>
</body>
</html>
