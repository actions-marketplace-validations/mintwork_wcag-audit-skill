<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Example Store</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
    :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
  </style>
</head>
<body>
  <header><a href="#main">Skip to content</a></header>
  <main id="main">
    <h1>Checkout</h1>
    <p>Readable fine print with sufficient contrast.</p>
    <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="40" height="40" alt="Store logo">
    <label for="coupon">Coupon code</label>
    <input type="text" id="coupon">
    <button type="button">Apply</button>
    <label for="card">Card number</label>
    <input type="text" id="card" autocomplete="cc-number">
    <a href="/help">Payment help</a>
  </main>
</body>
</html>
