name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for runtime tests
        run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Dogfood - SARIF from known-bad fixtures
        if: matrix.node == 20
        run: node dist/cli.js scan test/fixtures/static/bad --sarif -o fixtures.sarif --fail-on none
      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: fixtures-sarif
          path: fixtures.sarif
